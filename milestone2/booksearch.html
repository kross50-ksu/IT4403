<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Open Library Book Search</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="milestone2.css">
</head>

<body>

    <header class="hero">
        <h1>Book Search</h1>
        <p>Find books using the Open Library API</p>
    </header>

    <nav class="navbar">
        <a href="booksearch.html">Home</a>
        <a href="bookshelf.html">My Bookshelf</a>
    </nav>

    <main class="content">

        <section>

            <h2>Search Books</h2>

            <div class="search-container">

                <input
                    type="text"
                    id="searchTerm"
                    placeholder="Enter a title, author, or keyword">

                <button id="searchBtn">
                    Search
                </button>

            </div>

            <div class="pagination">

                <label for="pageSelect">
                    Page:
                </label>

                <select id="pageSelect"></select>

            </div>

        </section>

        <section>

            <div id="results">

                <div class="message">
                    Enter a search term to begin searching Open Library.
                </div>

            </div>

        </section>

    </main>

    <footer>
        <p>&copy; 2026 Khaliya Ross – IT 4403</p>
    </footer>

    <script>

        const RESULTS_PER_PAGE = 10;
        let currentSearch = "";

        for (let i = 1; i <= 6; i++) {
            $("#pageSelect").append(
                `<option value="${i}">Page ${i}</option>`
            );
        }

        $("#searchBtn").click(function () {

            currentSearch = $("#searchTerm").val().trim();

            if (currentSearch === "") {

                $("#results").html(`
                    <div class="message">
                        Please enter a search term.
                    </div>
                `);

                return;
            }

            $("#pageSelect").val(1);

            searchBooks(1);

        });

        $("#pageSelect").change(function () {

            if (currentSearch !== "") {
                searchBooks($(this).val());
            }

        });

        function searchBooks(page) {

            let url =
                `https://openlibrary.org/search.json?q=${encodeURIComponent(currentSearch)}&limit=${RESULTS_PER_PAGE}&page=${page}`;

            $.getJSON(url, function (data) {

                $("#results").empty();

                if (data.docs.length === 0) {

                    $("#results").html(`
                        <div class="message">
                            No results found.
                        </div>
                    `);

                    return;
                }

                data.docs.forEach(function (book) {

                    let cover = `
                        <div class="message">
                            No Cover Available
                        </div>
                    `;

                    if (book.cover_i) {

                        cover =
                            `<img
                                src="https://covers.openlibrary.org/b/id/${book.cover_i}-S.jpg"
                                alt="${book.title} cover">`;
                    }

                    let workId =
                        book.key.replace("/works/", "");

                    $("#results").append(`

                        <div class="book-card">

                            ${cover}

                            <h3>
                                <a href="bookdetails.html?workId=${workId}">
                                    ${book.title}
                                </a>
                            </h3>

                            <p>
                                <strong>Author:</strong>
                                ${book.author_name ?
                                    book.author_name.join(", ")
                                    : "Not Available"}
                            </p>

                            <p>
                                <strong>First Published:</strong>
                                ${book.first_publish_year || "Not Available"}
                            </p>

                        </div>

                    `);

                });

            })

            .fail(function () {

                $("#results").html(`
                    <div class="message">
                        Search request failed. Please try again.
                    </div>
                `);

            });

        }

    </script>

</body>

</html>
