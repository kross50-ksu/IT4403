<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Details</title>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="milestone2.css">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>

<body>

    <header class="hero">
        <h1>Book Details</h1>
        <p>Detailed information retrieved from the Open Library API</p>
    </header>

    <nav class="navbar">
        <a href="booksearch.html">Home</a>
        <a href="bookshelf.html">My Bookshelf</a>
    </nav>

    <main class="content">

        <div id="details" class="details-card">
            <p>Loading book details...</p>
        </div>

    </main>
    
    <a href="../index.html">← Back to Main Page</a>

    <footer>
        <p>&copy; 2026 Khaliya Ross – IT 4403</p>
    </footer>

    <script>

        const params = new URLSearchParams(window.location.search);
        const workId = params.get("workId");

        if (!workId) {

            $("#details").html(`
                <div class="message">
                    No Work ID was provided.
                </div>
            `);

        } else {

            $.getJSON(
                `https://openlibrary.org/works/${workId}.json`
            )

            .done(function(book) {

                let description = "Description not available.";

                if (typeof book.description === "string") {

                    description = book.description;

                } else if (
                    book.description &&
                    book.description.value
                ) {

                    description = book.description.value;
                }

                let subjects = "Not Available";

                if (book.subjects) {

                    subjects =
                        book.subjects
                        .slice(0, 10)
                        .join(", ");
                }

                let cover = `
                    <div class="message">
                        No cover image available.
                    </div>
                `;

                if (
                    book.covers &&
                    book.covers.length > 0
                ) {

                    cover = `
                        <img
                            src="https://covers.openlibrary.org/b/id/${book.covers[0]}-M.jpg"
                            alt="Cover image for ${book.title}">
                    `;
                }

                $("#details").html(`

                    ${cover}

                    <h2>${book.title}</h2>

                    <p>
                        <strong>Work ID:</strong>
                        ${workId}
                    </p>

                    <p>
                        <strong>Description:</strong>
                    </p>

                    <p>
                        ${description}
                    </p>

                    <p>
                        <strong>Subjects:</strong>
                    </p>

                    <p>
                        ${subjects}
                    </p>

                    <p>
                        <a
                            href="https://openlibrary.org/works/${workId}"
                            target="_blank">
                            View Book on Open Library
                        </a>
                    </p>

                `);

            })

            .fail(function() {

                $("#details").html(`
                    <div class="message">
                        Unable to retrieve book information from Open Library.
                    </div>
                `);

            });

        }

    </script>

</body>
</html>
