<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My Bookshelf</title>

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="milestone2.css">
    
</head>
<body>

<nav>
    <a href="booksearch.html">Home</a>
    <a href="bookshelf.html">My Bookshelf</a>
</nav>

<h1>My Bookshelf</h1>

<div id="bookshelf"></div>

<script>

const myBooks = [

    "OL17308344W",
    "OL21572859W",
    "OL22297316W",
    "OL27708692W",
    "OL16804365W"

];

myBooks.forEach(function(workId){

    $.getJSON(
        `https://openlibrary.org/works/${workId}.json`,

        function(book){

            let cover = "";

            if(book.covers &&
               book.covers.length > 0){

               cover =
               `<img src="https://covers.openlibrary.org/b/id/${book.covers[0]}-M.jpg"
                r">`;
            }

            $("#bookshelf").append(`

            <div class="book">

                ${cover}

                <h2>
                    <a href="bookdetails.html?workId=${workId}">
                        ${book.title}
                    </a>
                </h2>

            </div>

            `);

        }

    );

});

</script>

</body>
</html>
