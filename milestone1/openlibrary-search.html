<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Open Library Search Results</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            max-width: 1200px;
            margin: auto;
            padding: 20px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .book {
            background: white;
            margin-bottom: 20px;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,.1);
        }

        .book img {
            width: 150px;
            margin-bottom: 10px;
        }

        a {
            color: #0066cc;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <h1>Modern Web Search Results</h1>

    <div id="results">
        <p>Loading search results...</p>
    </div>

    <script>
        $(document).ready(function () {

            $.getJSON("openlibrary-search.json")

                .done(function (data) {

                    $("#results").empty();

                    data.docs.forEach(function (book) {

                        let coverHTML = "<p>No Cover Available</p>";

                        if (book.cover_i) {
                            coverHTML = `
                                <img
                                    src="https://covers.openlibrary.org/b/id/${book.cover_i}-M.jpg"
                                    alt="Cover image for ${book.title}">
                            `;
                        }

                        $("#results").append(`

                            <div class="book">

                                ${coverHTML}

                                <h2>${book.title || "Not Available"}</h2>

                                <p>
                                    <strong>Author(s):</strong>
                                    ${book.author_name
                                        ? book.author_name.join(", ")
                                        : "Not Available"}
                                </p>

                                <p>
                                    <strong>First Published:</strong>
                                    ${book.first_publish_year || "Not Available"}
                                </p>

                                <p>
                                    <strong>Edition Count:</strong>
                                    ${book.edition_count || "Not Available"}
                                </p>

                                <p>
                                    <strong>Ebook Access:</strong>
                                    ${book.ebook_access || "Not Available"}
                                </p>

                                <p>
                                    <strong>Language:</strong>
                                    ${book.language
                                        ? book.language.join(", ")
                                        : "Not Available"}
                                </p>

                                <p>
                                    <strong>Full Text Available:</strong>
                                    ${book.has_fulltext ? "Yes" : "No"}
                                </p>

                                <p>
                                    <strong>Work Key:</strong>
                                    ${book.key || "Not Available"}
                                </p>

                                <p>
                                    <a href="https://openlibrary.org${book.key}"
                                       target="_blank">
                                        View Open Library Record
                                    </a>
                                </p>

                            </div>

                        `);

                    });

                })

                .fail(function () {

                    $("#results").html(`
                        <div class="book">
                            <h2>Error</h2>
                            <p>Could not load openlibrary-search.json.</p>
                            <p>Make sure the JSON file is in the same folder as this HTML file.</p>
                        </div>
                    `);

                    console.error("Failed to load openlibrary-search.json");

                });

        });
    </script>

</body>
</html>
