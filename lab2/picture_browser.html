<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Exercise 7 – Picture Browser</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        #viewer { width:300px; height:200px; border:2px solid black; margin-bottom:10px; }
        #viewer img { width:100%; height:100%; }
        .thumb { width:80px; height:60px; margin:5px; cursor:pointer; border:2px solid transparent; }
        .thumb:hover { border-color:blue; }
    </style>
</head>

<body>

<h1>Exercise 7 – Picture Browser Application</h1>

<div id="viewer">
    <img id="mainImg" src="">
</div>

<div id="thumbs"></div>

<script>
$(document).ready(function () {

    let images = [
        "https://picsum.photos/id/1015/600/400",
        "https://picsum.photos/id/1025/600/400",
        "https://picsum.photos/id/1035/600/400",
        "https://picsum.photos/id/1045/600/400"
    ];

    let index = 0;

    $("#mainImg").attr("src", images[index]);

    images.forEach(function (img, i) {
        $("#thumbs").append(`<img class="thumb" src="${img}" data-index="${i}">`);
    });

    $(".thumb").click(function () {
        index = $(this).data("index");
        $("#mainImg").fadeOut(200, function () {
            $("#mainImg").attr("src", images[index]).fadeIn(200);
        });
    });

});
</script>

</body>
</html>
