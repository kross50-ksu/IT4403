<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Open Library Explorer - Milestone 4</title>

<link rel="stylesheet" href="css/styles.css">

<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mustache@4.2.0/mustache.min.js"></script>
</head>
<body>

<header>
    <h1>Open Library Explorer</h1>
</header>

<main>

<section class="search-section">

    <form id="searchForm">
        <input
            type="text"
            id="searchInput"
            placeholder="Search for books..."
            required
        >
        <button type="submit">Search</button>
    </form>

    <div class="view-controls">
        <button type="button" id="gridBtn">Grid View</button>
        <button type="button" id="listBtn">List View</button>
    </div>

</section>


<section class="results-section">

    <h2>Search Results</h2>

    <div id="loading"></div>
    <div id="spinner" class="spinner hidden"></div>

    <div id="results" class="grid-view"></div>

    <div id="pagination">
        <button id="prevBtn">Previous</button>
        <span id="pageInfo"></span>
        <button id="nextBtn">Next</button>
    </div>

</section>

<section class="collection-section">

    <h2>Science Fiction Collection</h2>

    <div id="collectionResults" class="grid-view"></div>

</section>

<section class="details-section">

    <h2>Book Details</h2>

    <div id="bookDetails">
        <p>Select a book to view details.</p>
    </div>

</section>

</main>


<!-- Search Result Template -->

<script id="book-template" type="x-tmpl-mustache">
<div class="book-card" data-key="{{key}}">
    <img src="{{cover}}" alt="{{title}}">
    <h3>{{title}}</h3>
    <p>{{author}}</p>
</div>
</script>

<!-- Details Template -->

<script id="details-template" type="x-tmpl-mustache">
<div class="details-card">

    <img src="{{cover}}" alt="{{title}}">

    <h2>{{title}}</h2>

    <p><strong>Work ID:</strong> {{workId}}</p>

    <p><strong>Authors:</strong> {{authors}}</p>

    <p><strong>Description:</strong> {{description}}</p>

    <p><strong>Language:</strong> {{language}}</p>

    <h3>Subjects</h3>

    <ul>
        {{#subjects}}
        <li>{{.}}</li>
        {{/subjects}}
    </ul>

    <a href="{{link}}" target="_blank">
        View on Open Library
    </a>

</div>
</script>

<script src="js/app.js"></script>

</body>
</html>
