<!DOCTYPE html>
<html>
<head>
    <title>jQuery Grade Calculator</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script>
        $(function () {
            $("#btn").click(function () {
                let score = parseFloat($("#score").val());
                let grade = "";

                if (score >= 90) grade = "A";
                else if (score >= 80) grade = "B";
                else if (score >= 70) grade = "C";
                else grade = "F";

                $("#result").text(`Your score is ${score} and your grade is ${grade}`);
            });
        });
    </script>
</head>

<body>
    <h1>jQuery Click Example</h1>

    Enter your score: <input type="text" id="score"><br>
    <button id="btn">Enter a score</button>

    <div id="result"></div>
</body>
</html>
